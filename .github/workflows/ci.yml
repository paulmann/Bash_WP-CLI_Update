name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | head -2
      - name: lint every shell file
        run: |
          shellcheck -f gcc Bash_WP-CLI_Update.sh Find_WP_Senior.sh \
            tools/scan-secrets.sh tests/*.sh tests/stub/wp

  test:
    name: test suite (bash ${{ matrix.bash }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The current bash of the runner image.
          - os: ubuntu-latest
            bash: 'current'
          # The documented floor, taken from a distribution that ships it instead
          # of compiled here. Ubuntu 22.04 has bash 5.1, which is the oldest
          # version in any distribution still receiving updates: CentOS 7 (bash
          # 4.2) went end-of-life in 2024, and RHEL 8 (4.4) cannot run the
          # manager any more. Compiling 4.2 on ubuntu-latest stopped working when
          # the image moved to a C23-by-default compiler in November 2026, and a
          # hand-built bash was always more fragile than a published one.
          - os: ubuntu-22.04
            bash: '5.1'
    steps:
      - uses: actions/checkout@v7

      - name: the image really ships the bash this job claims
        run: |
          v="$(bash -c 'echo "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}"')"
          echo "bash: ${v}"
          case "${{ matrix.bash }}" in
            current) echo "whatever the image ships is the point of this job" ;;
            5.1) [ "$v" = '5.1' ] || { echo "the image ships bash ${v}, expected 5.1"; exit 1; } ;;
            *) echo "unknown matrix entry"; exit 1 ;;
          esac

      - name: syntax
        run: for f in *.sh tools/*.sh tests/*.sh tests/stub/wp; do bash -n "$f"; done

      - name: suites
        run: |
          # The suites that exercise the user switch require root; on a runner the
          # account is 'runner', so root is borrowed explicitly. Checks that still
          # cannot run (no switchable account, no ionice) report SKIP with a reason.
          sudo env "PATH=$PATH" bash tests/run_tests.sh

      - name: nothing was written into the repository
        run: |
          git status --porcelain --untracked-files=all > /tmp/after.txt
          if [ -s /tmp/after.txt ]; then
            echo "the test run left files behind:"; cat /tmp/after.txt; exit 1
          fi

  docs:
    name: documentation and version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: version agrees everywhere
        run: |
          v="$(sed -n "s/^SCRIPT_VERSION='\(.*\)'.*/\1/p" Bash_WP-CLI_Update.sh | head -1)"
          echo "version: $v"
          test -n "$v"
          grep -q "$v" README.md
          grep -q "$v" CHANGELOG.md
      - name: every mode in --list-modes is documented
        run: |
          ./Bash_WP-CLI_Update.sh --list-modes > /tmp/modes.txt
          ./Bash_WP-CLI_Update.sh --help > /tmp/help.txt
          while read -r m; do
            [ -n "$m" ] || continue
            grep -q -- "--${m}" /tmp/help.txt || { echo "undocumented mode: ${m}"; exit 1; }
          done < /tmp/modes.txt
          echo "every mode is documented"
