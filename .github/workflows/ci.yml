name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --version | head -2
      - name: lint every shell file
        run: |
          shellcheck -f gcc Bash_WP-CLI_Update.sh Find_WP_Senior.sh \
            tools/scan-secrets.sh tests/*.sh tests/stub/wp

  test:
    name: test suite (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bash: 'system'   # ubuntu-latest ships bash 5.x
          - bash: '4.2'      # the documented floor
    steps:
      - uses: actions/checkout@v4

      - name: install the bash under test
        if: matrix.bash != 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl
          cd /tmp
          curl -fsSLO https://ftp.gnu.org/gnu/bash/bash-${{ matrix.bash }}.tar.gz
          tar xzf bash-${{ matrix.bash }}.tar.gz
          cd bash-${{ matrix.bash }}
          ./configure --without-bash-malloc >/dev/null
          make -j"$(nproc)" >/dev/null
          sudo make install
          /usr/local/bin/bash --version | head -1
          # Put the new bash first so the suites and their shebangs use it.
          sudo ln -sf /usr/local/bin/bash /usr/local/bin/bash42
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: syntax
        run: for f in *.sh tools/*.sh tests/*.sh tests/stub/wp; do bash -n "$f"; done

      - name: suites
        run: |
          # The suites that exercise the user switch require root; on a runner the
          # account is 'runner', so root is borrowed explicitly. Checks that still
          # cannot run (no switchable account, no ionice) report SKIP with a reason.
          if [ "${{ matrix.bash }}" = 'system' ]; then
            sudo env "PATH=$PATH" bash tests/run_tests.sh
          else
            sudo env "PATH=/usr/local/bin:$PATH" /usr/local/bin/bash tests/run_tests.sh
          fi

      - name: nothing was written into the repository
        run: |
          git status --porcelain --untracked-files=all > /tmp/after.txt
          if [ -s /tmp/after.txt ]; then
            echo "the test run left files behind:"; cat /tmp/after.txt; exit 1
          fi

  docs:
    name: documentation and version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version agrees everywhere
        run: |
          v="$(sed -n "s/^SCRIPT_VERSION='\(.*\)'.*/\1/p" Bash_WP-CLI_Update.sh | head -1)"
          echo "version: $v"
          test -n "$v"
          grep -q "$v" README.md
          grep -q "$v" CHANGELOG.md
      - name: every mode in --list-modes is documented
        run: |
          ./Bash_WP-CLI_Update.sh --list-modes > /tmp/modes.txt
          ./Bash_WP-CLI_Update.sh --help > /tmp/help.txt
          while read -r m; do
            [ -n "$m" ] || continue
            grep -q -- "--${m}" /tmp/help.txt || { echo "undocumented mode: ${m}"; exit 1; }
          done < /tmp/modes.txt
          echo "every mode is documented"
