name: release

# A tag is the release trigger. The workflow rebuilds, re-runs the gates and attaches
# the tarball to the release, so a release can never contain something the suite did
# not pass.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-publish (for example v8.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: version agrees with the tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            ref="${{ github.event.inputs.tag }}"
          else
            ref="$GITHUB_REF_NAME"
          fi
          echo "ref=$ref" >> "$GITHUB_ENV"
          tag="${ref#v}"
          script="$(sed -n "s/^SCRIPT_VERSION='\(.*\)'.*/\1/p" Bash_WP-CLI_Update.sh | head -1)"
          echo "tag=$tag script=$script"
          if [ "$tag" != "$script" ]; then
            echo "the tag and SCRIPT_VERSION disagree"; exit 1
          fi
          grep -q "$script" README.md
          grep -q "$script" CHANGELOG.md

      - name: gates
        run: |
          bash -n Bash_WP-CLI_Update.sh
          bash -n Find_WP_Senior.sh
          shellcheck -f gcc Bash_WP-CLI_Update.sh Find_WP_Senior.sh \
            tools/scan-secrets.sh tests/*.sh tests/stub/wp
          sudo bash tests/run_tests.sh

      - name: build the archive
        run: |
          make dist
          ls -l dist/
          # Basenames only: the checksum file is downloaded next to the tarball, not
          # inside a dist/ directory, so 'sha256sum -c SHA256SUMS' has to work from a
          # plain download directory.
          (cd dist && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: authenticate the CLI from the workflow token
        # The token is passed on stdin, never as NAME=value in the file: a workflow that
        # carries a credential-shaped assignment is refused by the project's own write
        # guard, and `gh auth login` is the documented way to hand it over anyway.
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: publish
        run: |
          tag="${ref#v}"
          # The section header is `## [8.0.0 / 2.1.0] - date`: match the prefix, not
          # `## [8.0.0]`, or the release body silently falls back to one sentence.
          notes="$(awk -v t="## [${tag}" 'index($0, t) == 1 {flag=1; next} /^## \[/ {flag=0} flag' CHANGELOG.md)"
          [ -n "$notes" ] || notes="Release ${ref}. See CHANGELOG.md."
          # Idempotent on purpose: a release can also be created by hand, and a red
          # pipeline for "already exists" is a pipeline people stop reading.
          if gh release view "$ref" >/dev/null 2>&1; then
            gh release upload "$ref" dist/*.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$ref" --notes "$notes"
          else
            gh release create "$ref" \
              --title "Bash WP-CLI Update ${ref}" \
              --notes "$notes" \
              dist/*.tar.gz dist/SHA256SUMS
          fi
